<script>
// 📤 Поділитися набором: у Telegram — вибір чату (t.me/share), у браузері — системне меню, інакше — копія посилання.
window.chatikShare = function (url, text, btn, copied) {
  var tg = window.Telegram && window.Telegram.WebApp;
  if (tg && tg.initData) {
    tg.openTelegramLink("https://t.me/share/url?url=" + encodeURIComponent(url) + "&text=" + encodeURIComponent(text));
    return;
  }
  if (navigator.share) { navigator.share({title: text, text: text, url: url}).catch(function () {}); return; }
  var done = function () { if (!btn) return; var o = btn.innerHTML; btn.innerHTML = copied; setTimeout(function () { btn.innerHTML = o; }, 1600); };
  if (navigator.clipboard) navigator.clipboard.writeText(url).then(done, function () { prompt("", url); });
  else prompt("", url);
};
(function () {
  var tg = window.Telegram && window.Telegram.WebApp;
  if (!tg || !tg.initData) return;
  try { tg.ready(); tg.expand(); tg.setHeaderColor("#121417"); tg.setBackgroundColor("#121417"); } catch (e) {}
  try {
    if (!localStorage.getItem("chatik-lang")) {
      var l = ((tg.initDataUnsafe && tg.initDataUnsafe.user) || {}).language_code || "";
      if (l.indexOf("uk") === 0 || l.indexOf("ru") === 0) localStorage.setItem("chatik-lang", l.slice(0, 2));
    }
  } catch (e) {}
  if (!/(^|\/)(index\.html)?$/.test(location.pathname)) {
    try { tg.BackButton.show(); tg.BackButton.onClick(function () { location.href = "index.html"; }); } catch (e) {}
  }
  document.addEventListener("click", function (e) {
    var a = e.target.closest && e.target.closest('a[href^="https://t.me/"]');
    if (a) { e.preventDefault(); tg.openTelegramLink(a.href); }
  });
})();
</script>

<style>
/* Layout: приборная панель ночью — хедер-питч, затем «бот-панель» с инлайн-кнопками слева и экран модуля с примером переписки справа */
:root{
  --asphalt:#121417; --panel:#1b1e23; --panel-2:#23272e; --line:#2f343c;
  --fg:#eceae4; --muted:#9aa0a8; --accent:#5fd3c4; --accent-ink:#15130f;
  --bubble-me:#2c4a37; --me-name:#9fe0b4; --bubble-bot:#262a31; --red:#ff5a4e;
  --f-display:"Fira Sans Extra Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--asphalt);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
.wrap{max-width:1120px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:.01em}

.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:18px 0}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);display:flex;gap:10px;align-items:center}
.eyebrow::before{content:"";width:22px;height:3px;background:var(--accent);border-radius:2px;flex:none}
.tools{display:flex;gap:8px;align-items:center;flex:none}
.share{appearance:none;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--fg);font:600 13px var(--f-body);padding:7px 12px;cursor:pointer}
.share:hover{border-color:var(--accent)}
.share:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex:none}
.lang button{appearance:none;border:0;background:var(--panel);color:var(--muted);font:600 13px var(--f-body);padding:7px 14px;cursor:pointer}
.lang button+button{border-left:1px solid var(--line)}
.lang button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.lang button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}

.hero{padding-block:26px 28px;display:grid;grid-template-columns:1.3fr 1fr;gap:32px;align-items:end;border-bottom:1px solid var(--line)}
.hero h1{font-size:clamp(44px,7vw,76px);line-height:.92;font-weight:800;text-transform:uppercase}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero p.lead{color:var(--muted);font-size:17px;max-width:56ch;margin:16px 0 0}
.gauge{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.gauge div{background:var(--panel);padding:14px 14px 12px}
.gauge b{display:block;font-family:var(--f-display);font-size:40px;line-height:1;font-weight:700;font-variant-numeric:tabular-nums}
.gauge span{font-size:12px;color:var(--muted)}

.how{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding-block:24px;margin:0;padding-left:0}
.how li{list-style:none;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;gap:12px}
.how .n{font-family:var(--f-display);font-weight:700;font-size:26px;color:var(--accent);line-height:1}
.how p{margin:0;font-size:14px}
.cmds code{font-family:var(--f-mono);font-size:12.5px;background:var(--panel-2);border:1px solid var(--line);padding:1px 6px;border-radius:6px;color:var(--fg)}

.main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:24px;align-items:start}
.botpanel{background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.bp-head{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);background:var(--panel-2)}
.ava{width:40px;height:40px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:20px;flex:none}
.bp-head b{display:block;font-size:15px}
.bp-head small{color:var(--muted);font-size:12px}
.bp-msg{margin:16px;background:var(--bubble-bot);border-radius:14px 14px 14px 4px;padding:12px 14px;font-size:14px}
.group{padding:4px 16px 14px}
.group h3{font-family:var(--f-mono);font-size:11px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:6px 0 8px}
.kb{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.kb button{appearance:none;border:1px solid var(--line);background:var(--panel-2);color:var(--fg);font:600 14px/1.25 var(--f-body);
  padding:11px 10px;border-radius:10px;cursor:pointer;text-align:center;transition:background .15s,border-color .15s,transform .1s;position:relative}
.kb button:hover{border-color:var(--accent)}
.kb button:active{transform:scale(.98)}
.kb button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.kb button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.kb button .beta{position:absolute;top:-6px;right:-4px;font:500 9.5px var(--f-mono);background:var(--asphalt);color:var(--accent);border:1px solid var(--accent);border-radius:6px;padding:0 4px;letter-spacing:.05em}

.screen{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px 22px 20px;min-width:0}
.screen .cat{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.screen h2{font-size:38px;line-height:1;font-weight:700;margin-top:8px;text-transform:uppercase}
.screen .pitch{margin:12px 0 0;font-size:16px}
.points{margin:14px 0 0;padding:0;display:grid;gap:7px}
.points li{list-style:none;padding-left:22px;position:relative;font-size:14px}
.points li::before{content:"";position:absolute;left:2px;top:.55em;width:10px;height:3px;border-radius:2px;background:var(--accent)}
.cmds{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.chat{margin-top:18px;background:var(--asphalt);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:10px}
.chat .label{font-family:var(--f-mono);font-size:11px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
.m{max-width:88%;padding:9px 12px;border-radius:14px;font-size:14px;white-space:pre-line;overflow-wrap:anywhere}
.m .who{display:block;font-size:12px;font-weight:700;color:var(--accent);margin-bottom:2px}
.m.me{justify-self:end;background:var(--bubble-me);border-bottom-right-radius:4px}
.m.me .who{color:var(--me-name)}
.m.bot{justify-self:start;background:var(--bubble-bot);border-bottom-left-radius:4px}
.m.alert{border:1px solid var(--red)}
.m.alert .who{color:var(--red)}
.ikb{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.ikb span{flex:1 1 auto;text-align:center;font-size:12.5px;font-weight:600;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.anim .m{animation:pop .35s ease both}
.anim .m:nth-child(3){animation-delay:.12s}.anim .m:nth-child(4){animation-delay:.24s}.anim .m:nth-child(5){animation-delay:.36s}
@keyframes pop{from{opacity:.25;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.anim .m{animation:none}.kb button{transition:none}}

.foot{margin-top:28px;padding-top:20px;border-top:1px solid var(--line);display:grid;grid-template-columns:1.4fr 1fr;gap:24px;color:var(--muted);font-size:13.5px}
.foot strong{color:var(--fg)}
.cta{background:var(--accent);color:var(--accent-ink);border-radius:14px;padding:16px 18px}
.cta h3{font-size:24px;text-transform:uppercase;font-weight:800}
.cta p{margin:6px 0 0;font-size:14px;color:var(--accent-ink)}
.cta-row{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin-top:12px}
.cta-btn{display:inline-block;background:var(--asphalt);color:var(--accent);font:700 15px var(--f-body);text-decoration:none;padding:10px 16px;border-radius:10px}
.cta-btn:hover{background:var(--panel)}
.cta-btn:focus-visible{outline:2px solid var(--accent-ink);outline-offset:2px}
.handle{font:500 13px var(--f-mono);color:var(--accent-ink);user-select:all}
.back{display:inline-block;margin-top:14px;font:600 13px var(--f-body);color:var(--muted);text-decoration:none}
.back:hover{color:var(--accent)}

@media (max-width:860px){
  .hero,.main,.foot{grid-template-columns:1fr}
  .how{grid-template-columns:1fr}
  .screen{position:static}
  .hero{padding-block:20px 22px}
}
@media (max-width:380px){.kb{grid-template-columns:1fr}}
</style>

</head>
